<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daisy Field – Rivka Leblanc</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="sky">
    <div class="sun"></div>
    <div class="cloud cloud1"><span></span><span></span><span></span></div>
    <div class="cloud cloud2"><span></span><span></span><span></span></div>
    <div class="cloud cloud3"><span></span><span></span></div>
    <div class="birds">
      <svg class="bird b1" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b2" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b3" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b4" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b5" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b6" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b7" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="bird b8" viewBox="0 0 20 10"><path d="M0,5 Q5,0 10,5 Q15,0 20,5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="ground">
    <div class="field">

      <!-- Each daisy: stem div + inline SVG head -->
      <!-- BACK ROW (small) -->
      <div class="daisy f-s" style="--x:2%;  --d:0s;   --h:88px;  --sw:4.2s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:9%;  --d:.5s;  --h:96px;  --sw:5.0s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:16%; --d:.9s;  --h:84px;  --sw:3.8s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:23%; --d:.3s;  --h:94px;  --sw:4.7s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:30%; --d:.7s;  --h:90px;  --sw:5.3s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:37%; --d:.2s;  --h:86px;  --sw:4.0s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:44%; --d:.8s;  --h:92px;  --sw:3.6s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:51%; --d:1.1s; --h:88px;  --sw:4.9s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:58%; --d:.4s;  --h:94px;  --sw:4.4s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:65%; --d:.6s;  --h:82px;  --sw:5.1s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:72%; --d:1.0s; --h:90px;  --sw:3.9s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:79%; --d:.1s;  --h:96px;  --sw:4.6s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:86%; --d:.7s;  --h:86px;  --sw:4.1s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>
      <div class="daisy f-s" style="--x:93%; --d:.3s;  --h:92px;  --sw:5.4s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-sm"/></svg>
      </div>

      <!-- FRONT ROW (large) -->
      <div class="daisy f-l" style="--x:0%;  --d:.6s;  --h:148px; --sw:4.5s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:7%;  --d:.2s;  --h:162px; --sw:5.2s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:14%; --d:1.0s; --h:142px; --sw:3.7s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:21%; --d:.4s;  --h:156px; --sw:4.8s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:28%; --d:.0s;  --h:150px; --sw:4.2s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:35%; --d:.8s;  --h:164px; --sw:5.6s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:42%; --d:.3s;  --h:140px; --sw:3.5s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:49%; --d:.9s;  --h:158px; --sw:4.6s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:56%; --d:.1s;  --h:152px; --sw:5.0s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:63%; --d:.5s;  --h:160px; --sw:4.1s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:70%; --d:.7s;  --h:144px; --sw:4.9s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:77%; --d:.2s;  --h:154px; --sw:3.8s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:84%; --d:.6s;  --h:146px; --sw:5.3s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:91%; --d:1.1s; --h:158px; --sw:4.4s; --lean:-1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>
      <div class="daisy f-l" style="--x:97%; --d:.4s;  --h:142px; --sw:3.6s; --lean:1">
        <svg class="bloom" viewBox="0 0 60 60"><use href="#daisy-lg"/></svg>
      </div>

    </div>
  </div>

  <!-- SVG symbol definitions — hidden, reused by all flowers -->
  <svg style="display:none">
    <defs>

      <radialGradient id="yc" cx="40%" cy="35%" r="65%">
        <stop offset="0%"   stop-color="#ffee58"/>
        <stop offset="45%"  stop-color="#fdd835"/>
        <stop offset="100%" stop-color="#b8860b"/>
      </radialGradient>

      <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="rgba(0,0,0,.3)"/>
      </filter>

      <!-- SMALL DAISY -->
      <g id="daisy-sm">
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(0   30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(22.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(45  30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(67.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(90  30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(112.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(135 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(157.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(180 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(202.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(225 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(247.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(270 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(292.5 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#f5f5f0" transform="rotate(315 30 30)"/>
        <ellipse cx="30" cy="13" rx="4.5" ry="10" fill="#eeeee8" transform="rotate(337.5 30 30)"/>
        <circle cx="30" cy="30" r="9" fill="#f5c800"/>
      </g>

      <!-- LARGE DAISY -->
      <g id="daisy-lg">
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(0   30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(22.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(45  30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(67.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(90  30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(112.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(135 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(157.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(180 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(202.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(225 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(247.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(270 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(292.5 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#f8f8f3" transform="rotate(315 30 30)"/>
        <ellipse cx="30" cy="11" rx="5.5" ry="12" fill="#ededea" transform="rotate(337.5 30 30)"/>
        <circle cx="30" cy="30" r="11" fill="#f5c800"/>
      </g>

    </defs>
  </svg>

</body>
</html>
