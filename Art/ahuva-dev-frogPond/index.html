<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Pond</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scene">

    <div class="sun"></div>

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <div class="pond">
        <div class="water-shine shine-one"></div>
        <div class="water-shine shine-two"></div>

        <div class="lily lily-one"></div>
        <div class="lily lily-two"></div>

        <div class="ripple ripple-one"></div>
        <div class="ripple ripple-two"></div>

        <div class="frog">
            <div class="frog-body"></div>

            <div class="eye eye-left">
                <span></span>
            </div>

            <div class="eye eye-right">
                <span></span>
            </div>

            <div class="mouth"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
    </div>

    <div class="grass grass-one"></div>
    <div class="grass grass-two"></div>
    <div class="grass grass-three"></div>

    <div class="flower flower-one">
        <span></span>
    </div>

    <div class="flower flower-two">
        <span></span>
    </div>

</div>

</body>
</html>
