<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Bee</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="scene">

    <div class="sun"></div>

    <div class="cloud cloud-one">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="cloud cloud-two">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="bee-path"></div>

    <div class="bee">
      <div class="wing wing-left"></div>
      <div class="wing wing-right"></div>

      <div class="bee-body">
        <div class="stripe stripe-one"></div>
        <div class="stripe stripe-two"></div>

        <div class="bee-head">
          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>
          <div class="smile"></div>
          <div class="antenna antenna-left"></div>
          <div class="antenna antenna-right"></div>
        </div>

        <div class="stinger"></div>
      </div>
    </div>

    <div class="flowers">
      <div class="flower flower-one">
        <div class="petals">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="flower-center"></div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
      </div>

      <div class="flower flower-two">
        <div class="petals">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="flower-center"></div>
        <div class="stem"></div>
        <div class="leaf leaf-right"></div>
      </div>

      <div class="flower flower-three">
        <div class="petals">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="flower-center"></div>
        <div class="stem"></div>
      </div>
    </div>

    <div class="grass"></div>

    <div class="title">
      <span>Little Bee</span>
    </div>

  </div>
</body>
</html>
