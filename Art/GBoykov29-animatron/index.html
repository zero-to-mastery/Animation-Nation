<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Българско Знаме Анимация - GBoykov29</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="scene">
      <!-- Сцена със знаме -->
      <div class="flag-container">
        <div class="flag">
          <div class="stripe white"></div>
          <div class="stripe green"></div>
          <div class="stripe red"></div>
        </div>
        <!-- Стойка -->
        <div class="pole"></div>
      </div>

      <!-- Анимиран надпис -->
      <div class="country-title">
        <span class="letter white">Б</span>
        <span class="letter white">Ъ</span>
        <span class="letter white">Л</span>
        <span class="letter green">Г</span>
        <span class="letter green">А</span>
        <span class="letter green">Р</span>
        <span class="letter red">И</span>
        <span class="letter red">Я</span>
      </div>
    </div>
  </body>
</html>
