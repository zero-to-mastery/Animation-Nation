<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falling leaves</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
<div class="stage" role="img" aria-label="Leaves drifting down from a tree">
  <div class="ground"></div>
  <div class="trunk"></div>
  <div class="crown c1"></div><div class="crown c2"></div><div class="crown c3"></div>

  <span class="leaf" style="--l:100px;--t:6s;--dl:0s;--c:#d9622b"><i></i></span>
  <span class="leaf" style="--l:140px;--t:7s;--dl:1.2s;--c:#e8a33a"><i></i></span>
  <span class="leaf" style="--l:190px;--t:5.5s;--dl:2.1s;--c:#b8432a"><i></i></span>
  <span class="leaf" style="--l:230px;--t:6.5s;--dl:.6s;--c:#e8a33a"><i></i></span>
  <span class="leaf" style="--l:120px;--t:7.5s;--dl:3.4s;--c:#c9541f"><i></i></span>
  <span class="leaf" style="--l:170px;--t:6s;--dl:4.2s;--c:#d9622b"><i></i></span>
  <span class="leaf" style="--l:210px;--t:8s;--dl:2.8s;--c:#b8432a"><i></i></span>
  <span class="leaf" style="--l:80px;--t:7s;--dl:5s;--c:#e8a33a"><i></i></span>
</div>
</body>
</html>
