<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simon's Animation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="universe" aria-label="Animated cosmic portal with orbiting rings and stars.">
    <div class="stars stars-one" aria-hidden="true"></div>
    <div class="stars stars-two" aria-hidden="true"></div>
    <div class="nebula" aria-hidden="true"></div>
    <section class="portal" aria-hidden="true">
      <div class="halo"></div>
      <div class="orbit orbit-one"><i></i><i></i></div>
      <div class="orbit orbit-two"><i></i></div>
      <div class="orbit orbit-three"><i></i></div>
      <div class="rune rune-one"></div>
      <div class="rune rune-two"></div>
      <div class="core"><div class="core-inner"></div></div>
      <div class="pulse pulse-one"></div>
      <div class="pulse pulse-two"></div>
    </section>
  </main>
</body>
</html>
