<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Matrix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-floor"></div>
  <div class="engine-stage">
    <div class="holo-ring holo-ring-1"></div>
    <div class="holo-ring holo-ring-2"></div>
    <div class="holo-ring holo-ring-3"></div>
    <div class="laser-pillar pillar-1"></div>
    <div class="laser-pillar pillar-2"></div>
    <div class="laser-pillar pillar-3"></div>
    <div class="laser-pillar pillar-4"></div>
    <div class="matrix-cube">
      <div class="cube-face face-front"></div>
      <div class="cube-face face-back"></div>
      <div class="cube-face face-right"></div>
      <div class="cube-face face-left"></div>
      <div class="cube-face face-top"></div>
      <div class="cube-face face-bottom"></div>
    </div>
    <div class="core-crystal">
      <div class="crystal-pyramid">
        <div class="crystal-face pyr-1"></div>
        <div class="crystal-face pyr-2"></div>
        <div class="crystal-face pyr-3"></div>
        <div class="crystal-face pyr-4"></div>
      </div>
      <div class="crystal-pyramid bottom-pyr">
        <div class="crystal-face pyr-1"></div>
        <div class="crystal-face pyr-2"></div>
        <div class="crystal-face pyr-3"></div>
        <div class="crystal-face pyr-4"></div>
      </div>
    </div>
    <div class="particle-field">
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>
    </div>
  </div>
</body>
</html>
