<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainy Cloud Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(#87ceeb, #e0f6ff);
            overflow: hidden;
        }

        /* Cloud */
        .cloud {
            position: absolute;
            top: 100px;
            left: -250px;

            width: 220px;
            height: 70px;

            background: white;
            border-radius: 50px;

            animation: moveCloud 10s linear infinite;
        }

        .cloud::before {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;

            top: -40px;
            left: 35px;
        }

        .cloud::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 50%;

            top: -55px;
            right: 25px;
        }

        /* Rain */
        .rain {
            position: absolute;
            top: 165px;
            left: 40px;

            width: 4px;
            height: 25px;

            background: #3498db;
            border-radius: 5px;

            animation: fall 1s linear infinite;
        }

        .rain:nth-child(2) {
            left: 80px;
            animation-delay: 0.2s;
        }

        .rain:nth-child(3) {
            left: 120px;
            animation-delay: 0.4s;
        }

        .rain:nth-child(4) {
            left: 160px;
            animation-delay: 0.6s;
        }

        .rain:nth-child(5) {
            left: 200px;
            animation-delay: 0.8s;
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;

            width: 100%;
            height: 100px;

            background: #5ca65c;
        }

        /* Text */
        h1 {
            position: absolute;
            top: 40px;
            width: 100%;

            text-align: center;
            color: white;

            font-family: Arial, sans-serif;
        }

        /* Cloud movement */
        @keyframes moveCloud {

            0% {
                left: -250px;
            }

            100% {
                left: 100%;
            }
        }

        /* Rain movement */
        @keyframes fall {

            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(200px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>🌧️ Rainy Day</h1>

    <div class="cloud">

        <div class="rain"></div>
        <div class="rain"></div>
        <div class="rain"></div>
        <div class="rain"></div>
        <div class="rain"></div>

    </div>

    <div class="ground"></div>

</body>
</html>
