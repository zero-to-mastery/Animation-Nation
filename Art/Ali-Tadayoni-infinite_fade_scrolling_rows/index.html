<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Fade Scrolling Rows</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="container">
      <div class="list">
        <div class="fade-placeholder fade-placeholder--right"></div>
        <div class="fade-placeholder fade-placeholder--left"></div>
        <div class="fade-placeholder fade-placeholder--bottom"></div>
        <div class="list__row list__row--1">
          <li class="card"><span class="list__item-icon">😁</span></li>
          <li class="card"><span class="card__icon">😀</span></li>
          <li class="card"><span class="card__icon">😄</span></li>
          <li class="card"><span class="card__icon">😆</span></li>
          <li class="card"><span class="card__icon">🥹</span></li>
          <li class="card"><span class="card__icon">😅</span></li>
          <li class="card"><span class="card__icon">😇</span></li>
          <li class="card"><span class="card__icon">🥶</span></li>
          <li class="card"><span class="card__icon">🤪</span></li>
          <li class="card"><span class="card__icon">😍</span></li>
        </div>
        <div class="list__row list__row--2">
          <li class="card"><span class="card__icon">🚀</span></li>
          <li class="card"><span class="card__icon">🤖</span></li>
          <li class="card"><span class="card__icon">👾</span></li>
          <li class="card"><span class="card__icon">🦄</span></li>
          <li class="card"><span class="card__icon">🔥</span></li>
          <li class="card"><span class="card__icon">⚡</span></li>
          <li class="card"><span class="card__icon">🌈</span></li>
          <li class="card"><span class="card__icon">💎</span></li>
          <li class="card"><span class="card__icon">🪐</span></li>
          <li class="card"><span class="card__icon">🛸</span></li>
        </div>
        <div class="list__row list__row--3">
          <li class="card"><span class="card__icon">🦊</span></li>
          <li class="card"><span class="card__icon">🐼</span></li>
          <li class="card"><span class="card__icon">🐨</span></li>
          <li class="card"><span class="card__icon">🦁</span></li>
          <li class="card"><span class="card__icon">🐯</span></li>
          <li class="card"><span class="card__icon">🐸</span></li>
          <li class="card"><span class="card__icon">🦝</span></li>
          <li class="card"><span class="card__icon">🐙</span></li>
          <li class="card"><span class="card__icon">🦈</span></li>
          <li class="card"><span class="card__icon">🦄</span></li>
        </div>
      </div>
    </section>
  </body>
</html>
